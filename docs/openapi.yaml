openapi: 3.0.3
info:
  title: Project You Shall Not Pass API
  version: 2.0.0
  description: Contrato conceptual del acceso híbrido AWS y Edge.
servers:
  - url: https://example.execute-api.us-east-1.amazonaws.com/api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Comprobar disponibilidad del backend AWS
      security: []
      operationId: getHealth
      responses:
        '200':
          description: Backend disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /edge/config:
    get:
      summary: Consultar la configuración versionada del dispositivo
      operationId: getEdgeConfiguration
      security:
        - deviceBearerAuth: []
      parameters:
        - name: deviceId
          in: query
          required: true
          schema:
            type: string
        - name: currentVersion
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Configuración vigente o nueva versión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationSnapshot'
        '304':
          description: La versión local continúa vigente
        '403':
          $ref: '#/components/responses/Forbidden'
  /edge/events/sync:
    post:
      summary: Sincronizar eventos creados durante el modo offline
      operationId: syncEdgeEvents
      security:
        - deviceBearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatch'
      responses:
        '200':
          description: Resultado por evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '409':
          $ref: '#/components/responses/Conflict'
  /edge/status:
    post:
      summary: Informar modo, versión y salud del dispositivo
      operationId: reportEdgeStatus
      security:
        - deviceBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdgeStatus'
      responses:
        '202':
          description: Estado recibido
  /access-requests:
    post:
      summary: Crear solicitud RFID
      security: []
      operationId: createAccessRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessRequest'
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /access-requests/{requestId}:
    get:
      summary: Consultar solicitud
      security: []
      operationId: getAccessRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /access-requests/{requestId}/face-verification:
    post:
      summary: Validación facial temporal
      operationId: verifyFace
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceVerification'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '410':
          $ref: '#/components/responses/Expired'
  /access-requests/{requestId}/confirm:
    post:
      summary: Confirmar sensor
      security: []
      operationId: confirmCrossing
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Confirmada o resultado previo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /occupancy:
    get:
      summary: Consultar aforo
      operationId: getOccupancy
      parameters:
        - name: locationId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Aforo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Occupancy'
  /presence:
    get:
      summary: Consultar presencia
      operationId: getPresence
      responses:
        '200':
          description: Lista según rol
  /events:
    get:
      summary: Consultar eventos
      operationId: getEvents
      responses:
        '200':
          description: Eventos filtrados
  /visitors:
    post:
      summary: Crear visitante diario
      operationId: createVisitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVisitor'
      responses:
        '201':
          description: Creado
        '403':
          $ref: '#/components/responses/Forbidden'
  /cards/{cardUid}/report-lost:
    post:
      summary: Reportar tarjeta perdida
      operationId: reportLostCard
      parameters:
        - name: cardUid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bloqueada
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: DeviceToken
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
  responses:
    Conflict:
      description: Conflicto
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Expired:
      description: Vencida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permiso insuficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateAccessRequest:
      type: object
      required: [cardUid, direction, source, deviceId, locationId]
      properties:
        cardUid:
          type: string
        direction:
          type: string
          enum: [ENTRY, EXIT]
        source:
          type: string
          enum: [WEB_SIMULATOR, EDGE_SIMULATOR, RASPBERRY_PI, PHYSICAL_READER]
        deviceId:
          type: string
        locationId:
          type: string
    FaceVerification:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [MOCK, REKOGNITION, LOCAL]
        mockIdentityId:
          type: string
          description: Solo pruebas ficticias.
        imageBase64:
          type: string
          format: byte
          writeOnly: true
          description: Captura temporal; no almacenar ni registrar.
    AccessRequest:
      type: object
      required: [requestId, state, createdAt, expiresAt]
      properties:
        requestId:
          type: string
        state:
          type: string
          enum: [PENDING_FACE, VALIDATING, AUTHORIZED, CONFIRMED, REJECTED, EXPIRED, CANCELLED]
        reasonCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        operationMode:
          $ref: '#/components/schemas/OperationMode'
    Occupancy:
      type: object
      properties:
        locationId:
          type: string
        current:
          type: integer
          minimum: 0
        maximum:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [AVAILABLE, NEAR_CAPACITY, FULL]
    OperationMode:
      type: string
      enum: [ONLINE, OFFLINE_VALID, OFFLINE_EXPIRED, SYNCING, LOCKDOWN]
    Health:
      type: object
      required: [status, serverTime]
      properties:
        status:
          type: string
          enum: [OK]
        serverTime:
          type: string
          format: date-time
    ConfigurationSnapshot:
      type: object
      required: [deviceId, version, generatedAt, validUntil, checksum, signature]
      properties:
        deviceId:
          type: string
        version:
          type: integer
          minimum: 1
        generatedAt:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
          description: Doce horas después de la última sincronización válida en el Diseño 2.0.
        checksum:
          type: string
        signature:
          type: string
          writeOnly: true
        configuration:
          type: object
          additionalProperties: true
    SyncBatch:
      type: object
      required: [deviceId, events]
      properties:
        deviceId:
          type: string
        events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/OfflineEvent'
    OfflineEvent:
      type: object
      required: [eventId, requestId, occurredAt, operationMode, eventType]
      properties:
        eventId:
          type: string
        requestId:
          type: string
        occurredAt:
          type: string
          format: date-time
        operationMode:
          $ref: '#/components/schemas/OperationMode'
        eventType:
          type: string
        reasonCode:
          type: string
          nullable: true
    SyncResult:
      type: object
      required: [acceptedEventIds, duplicateEventIds, rejectedEventIds]
      properties:
        acceptedEventIds:
          type: array
          items:
            type: string
        duplicateEventIds:
          type: array
          items:
            type: string
        rejectedEventIds:
          type: array
          items:
            type: string
    EdgeStatus:
      type: object
      required: [deviceId, operationMode, configurationVersion, pendingEventCount, reportedAt]
      properties:
        deviceId:
          type: string
        operationMode:
          $ref: '#/components/schemas/OperationMode'
        configurationVersion:
          type: integer
        pendingEventCount:
          type: integer
          minimum: 0
        reportedAt:
          type: string
          format: date-time
    CreateVisitor:
      type: object
      required: [displayName, hostPersonId, reason, validUntil]
      properties:
        displayName:
          type: string
        hostPersonId:
          type: string
        reason:
          type: string
        validUntil:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          example: ALREADY_INSIDE
        message:
          type: string
        requestId:
          type: string
